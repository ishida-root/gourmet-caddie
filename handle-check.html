<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>登録済みチェック｜グルメキャディ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{font-family:'Hiragino Sans','Noto Sans JP',sans-serif;background:#f5f6f8;margin:0;padding:24px;color:#222}
  .card{max-width:420px;margin:40px auto;background:#fff;border-radius:12px;padding:28px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
  h1{font-size:18px;margin:0 0 6px}
  p.desc{font-size:13px;color:#777;margin:0 0 20px;line-height:1.6}
  input{width:100%;box-sizing:border-box;padding:12px;font-size:16px;border:1px solid #ddd;border-radius:8px;margin-bottom:12px}
  button{width:100%;padding:12px;font-size:15px;font-weight:600;border:none;border-radius:8px;background:#3b82f6;color:#fff;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  #result{margin-top:18px;padding:14px;border-radius:8px;font-size:14px;line-height:1.6;display:none}
  #result.found{background:#fee2e2;color:#991b1b;display:block}
  #result.notfound{background:#dcfce7;color:#166534;display:block}
  #result.error{background:#fef3c7;color:#92400e;display:block}
</style>
</head>
<body>
<div class="card">
  <h1>🔍 登録済みチェック</h1>
  <p class="desc">InstagramのID（@から始まるハンドル）を入力して「確認する」を押してください。名前・ID以外の情報（料金・連絡先など）は一切表示されません。</p>
  <input id="handleInput" type="text" placeholder="@example_account" autocomplete="off">
  <button id="checkBtn" onclick="checkHandle()">確認する</button>
  <div id="result"></div>
</div>
<script>
var SUPA_URL='https://vwtcshwzetxnaedjhoej.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ3dGNzaHd6ZXR4bmFlZGpob2VqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MzM3MTgsImV4cCI6MjA5NDIwOTcxOH0.S10RHDE7wvKUMa2SxeoNvkgg6TtiMInw7ax6J5ZuMZk';
function normalize(h){return(h||'').trim().toLowerCase().replace(/^@/,'');}
async function checkHandle(){
  var input=document.getElementById('handleInput');
  var btn=document.getElementById('checkBtn');
  var result=document.getElementById('result');
  var raw=input.value.trim();
  result.className='';result.style.display='';
  if(!raw){result.className='error';result.textContent='IDを入力してください';return;}
  btn.disabled=true;btn.textContent='確認中...';
  try{
    var url=SUPA_URL+'/rest/v1/influencers?select='+encodeURIComponent('data->>handle,data->>name');
    var res=await fetch(url,{headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY}});
    if(!res.ok)throw new Error('fetch failed');
    var rows=await res.json();
    var target=normalize(raw);
    var match=rows.find(function(r){return r.handle&&normalize(r.handle)===target;});
    if(match){
      result.className='found';
      result.textContent='⚠️ 登録済みです（「'+match.name+'」として登録されています）。このアカウントは新規登録しないでください。';
    }else{
      result.className='notfound';
      result.textContent='✅ 未登録です。新規登録を進めて問題ありません。';
    }
  }catch(e){
    result.className='error';
    result.textContent='確認に失敗しました。通信環境を確認してもう一度お試しください。';
  }
  btn.disabled=false;btn.textContent='確認する';
}
document.getElementById('handleInput').addEventListener('keydown',function(e){if(e.key==='Enter')checkHandle();});
</script>
</body>
</html>
